<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ad1233"><title>Signer le briefing · Journal de chantier</title><link rel="stylesheet" href="briefing-v158.css?v=15.8"><script src="../config.js?v=14.2-collaborateurs" defer></script><script src="../supabase.js?v=14.2-collaborateurs" defer></script><script src="signer.js?v=15.8" defer></script></head>
<body class="briefing-sign-page"><main class="briefing-sign-card"><header><small>JOURNAL DE CHANTIER</small><h1>Signer le briefing</h1><p id="signSession">Chargement de la séance…</p></header><p id="signNotice" role="status"></p><form id="signForm" hidden><div class="briefing-sign-grid"><label>Nom<input name="nom" autocomplete="family-name" maxlength="120" required></label><label>Prénom<input name="prenom" autocomplete="given-name" maxlength="120" required></label><label>Fonction<input name="fonction" autocomplete="organization-title" maxlength="120" required placeholder="Ex. RSO, conducteur…"></label><label>Entreprise<input name="entreprise" autocomplete="organization" maxlength="120" required></label></div><label class="briefing-sign-label">Votre signature</label><canvas id="signCanvas" width="800" height="260" aria-label="Dessiner votre signature avec le doigt"></canvas><button type="button" id="signClear" class="briefing-sign-clear">Effacer la signature</button><p class="briefing-sign-help">En validant, je confirme ma participation au briefing indiqué ci-dessus.</p><button id="signSubmit" class="briefing-sign-primary" type="submit">Valider ma signature</button></form><section id="signSuccess" hidden><div class="briefing-sign-check">✓</div><h2>Signature reçue</h2><p>Votre présence a été transmise à l’encadrant pour ce briefing. Vous pouvez fermer cette page.</p><button type="button" id="signAnother">Faire signer une autre personne</button></section></main></body></html>
