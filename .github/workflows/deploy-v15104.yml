name: Installer le Journal V15.10.4 - numérotation des rapports
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260910000500_v15_10_4_report_numbers.sql'
      - 'supabase/tests/report-numbering-*'
      - 'scripts/deploy-v15104-release.py'
      - 'tests/v15104-installation.test.py'
      - '.github/workflows/deploy-v15104.yml'
      - 'scripts/prepare-v15105-update.py'
      - 'scripts/update-v15105-termux.sh'
      - 'tests/v15105-installation.test.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: journal-ci-only
          POSTGRES_DB: journal_v15104_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d journal_v15104_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier le chemin de déploiement avant toute connexion
        run: |
          python3 tests/v15104-installation.test.py
          python3 tests/v15105-installation.test.py
      - name: Vérifier les tables et les droits sur PostgreSQL 17 jetable
        shell: bash
        run: |
          set -euo pipefail
          test_container="${{ job.services.postgres.id }}"
          for file in supabase/tests/backend-fixture.sql supabase/tests/backend-production-shape.sql supabase/migrations/20260906000300_v14_2_contraintes_reelles.sql supabase/tests/feedback-backend-fixture.sql supabase/migrations/20260907000500_v14_5_retours_application.sql supabase/migrations/20260908000100_v15_cr_encadrement.sql supabase/migrations/20260908000200_v15_1_cr_perimetres.sql supabase/migrations/20260908000300_v15_2_cr_simple.sql supabase/migrations/20260909000100_v15_3_cr_tables.sql supabase/migrations/20260909000200_v15_4_production_email.sql supabase/migrations/20260909000300_v15_5_requests_pdf.sql supabase/migrations/20260909000400_v15_6_writing_references_delete.sql supabase/migrations/20260909000500_v15_7_reference_catalogue.sql supabase/migrations/20260910000100_v15_8_preparation_briefing.sql supabase/migrations/20260910000200_v15_9_completion_partagee.sql; do
            docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 < "$file"
          done
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.journal_sql_migrations (migration_name text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());"
          python3 scripts/deploy-v15101-release.py --print-sql | docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 < supabase/tests/report-numbering-fixture.sql
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 < supabase/migrations/20260907000700_archive_rapports_journaliers.sql
          python3 scripts/deploy-v15104-release.py --print-sql | docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 < supabase/tests/report-numbering-v15104-postgres.sql
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 < supabase/tests/reports-v1510-postgres.sql
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 < supabase/tests/collaboration-v15101-postgres.sql
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM public.journal_sql_migrations WHERE migration_name in ('20260910000300_v15_10_rapports_mentions.sql','20260910000400_v15_10_1_signatures_notifications.sql')) <> 2 THEN RAISE EXCEPTION 'Migration non enregistrée'; END IF; END \$\$;"
      - name: Vérifier les créations simultanées sur PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test_container="${{ job.services.postgres.id }}"
          for number in 1 2; do
            docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 -c "BEGIN; SET request.jwt.claim.sub='00000000-0000-4000-8000-000000000002'; SET ROLE authenticated; SELECT journal_report_api('create',jsonb_build_object('id','cccccccc-0000-4000-8000-00000000000${number}','request_id',gen_random_uuid(),'chantier_id','aaaaaaaa-0000-4000-8000-000000000001','document','{\"schema\":1,\"meta\":{\"operation\":\"Test simultané\",\"date\":\"2026-09-10\"}}'::jsonb)); SELECT pg_sleep(0.3); COMMIT;" > "/tmp/rj-number-${number}.txt" &
            jobs_to_wait[$number]=$!
          done
          wait "${jobs_to_wait[1]}"
          wait "${jobs_to_wait[2]}"
          docker exec -i "$test_container" psql -U postgres -d journal_v15104_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(distinct serial)=2 AND max(serial)-min(serial)=1 FROM journal_report_private.numbers WHERE report_id IN ('cccccccc-0000-4000-8000-000000000001','cccccccc-0000-4000-8000-000000000002')) IS NOT TRUE THEN RAISE EXCEPTION 'Numérotation concurrente incorrecte'; END IF; END \$\$;"
      - name: Vérifier les numéros, les exports et la transaction de déploiement
        run: |
          npm install --prefix /tmp/journal-v15104-tests @electric-sql/pglite@0.5.8 --ignore-scripts --no-audit --no-fund
          PGLITE_MODULE=/tmp/journal-v15104-tests/node_modules/@electric-sql/pglite node supabase/tests/report-numbering-v15104-backend.cjs
          PGLITE_MODULE=/tmp/journal-v15104-tests/node_modules/@electric-sql/pglite node supabase/tests/report-numbering-v15104-deployment.cjs
      - name: Installer le client PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Installer uniquement la numérotation V15.10.4
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/deploy-v15104-release.py
