name: Installer le Journal V15 et les CR encadrement
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260908000100_v15_cr_encadrement.sql'
      - 'supabase/functions/journal-cr-send/**'
      - 'supabase/functions/journal-v15-push/**'
      - 'supabase/tests/cr-v15-*'
      - 'scripts/deploy-v15-release.py'
      - 'scripts/configure-v15.py'
      - '.github/workflows/deploy-v15.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: journal-ci-only
          POSTGRES_DB: journal_v15_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d journal_v15_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Valider la migration et le cloisonnement sur PostgreSQL 17 jetable
        shell: bash
        run: |
          set -euo pipefail
          test_container="${{ job.services.postgres.id }}"
          for file in supabase/tests/backend-fixture.sql supabase/tests/backend-production-shape.sql supabase/migrations/20260906000300_v14_2_contraintes_reelles.sql supabase/migrations/20260908000100_v15_cr_encadrement.sql supabase/migrations/20260908000100_v15_cr_encadrement.sql supabase/tests/cr-v15-postgres.sql; do
            docker exec -i "$test_container" psql -U postgres -d journal_v15_test -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Tester la collaboration et les envois sans contacter de destinataire
        run: |
          npm install --prefix /tmp/journal-v15-tests @electric-sql/pglite@0.5.8 --ignore-scripts --no-audit --no-fund
          PGLITE_MODULE=/tmp/journal-v15-tests/node_modules/@electric-sql/pglite node supabase/tests/cr-v15-backend.cjs
          PGLITE_MODULE=/tmp/journal-v15-tests/node_modules/@electric-sql/pglite node supabase/tests/cr-v15-coexistence.cjs
          node --test supabase/tests/cr-v15-email.test.cjs supabase/tests/cr-v15-push.test.cjs
          python3 tests/v15-installation.test.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Installer le client PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Appliquer la migration additive et configurer les fonctions
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOURNAL_CR_FROM: ${{ secrets.JOURNAL_CR_FROM }}
        run: |
          python3 scripts/deploy-v15-release.py
          python3 scripts/configure-v15.py
