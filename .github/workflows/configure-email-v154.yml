name: Configuration email V15.4
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Activer le service pour une seule adresse de test
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOURNAL_CR_FROM: ${{ secrets.JOURNAL_CR_FROM }}
          JOURNAL_CR_TEST_TO: ${{ secrets.JOURNAL_CR_TEST_TO }}
        run: python3 scripts/configure-v154-email.py
