name: Diagnostic Journal Supabase lecture seule
on:
  push:
    branches: ['diagnostic-journal-schema-*']
permissions:
  contents: read
jobs:
  schema:
    if: startsWith(github.ref, 'refs/heads/diagnostic-journal-schema-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperer les trois fichiers de diagnostic
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer le client PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Lire uniquement les catalogues PostgreSQL
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 collect-schema.py
      - name: Rendre le rapport disponible au telephone
        uses: actions/upload-artifact@v4
        with:
          name: journal-schema-diagnostic
          path: diagnostic-output/Diagnostic-Supabase.json
          if-no-files-found: error
          retention-days: 1
