name: Deployer les migrations Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**/*.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Appliquer les migrations SQL
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier les secrets requis
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Le secret SUPABASE_ACCESS_TOKEN est absent."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Le secret SUPABASE_DB_PASSWORD est absent."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Le secret SUPABASE_PROJECT_ID est absent."; exit 1; }

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Initialiser et lier le projet de production
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Verifier les migrations a appliquer
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Appliquer les nouvelles migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
