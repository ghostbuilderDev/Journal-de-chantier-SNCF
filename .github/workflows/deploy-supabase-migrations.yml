name: Deployer les migrations Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**/*.sql"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Appliquer les migrations SQL
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier les secrets requis
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Le secret SUPABASE_ACCESS_TOKEN est absent."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Le secret SUPABASE_PROJECT_ID est absent."; exit 1; }

      - name: Appliquer la migration documentaire
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260901000100_documentation_securisee.sql"
          test -f "$migration" || { echo "Migration documentaire introuvable."; exit 1; }
          payload="$(jq -n --rawfile query "$migration" '{query: $query}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload"
