name: Deployer les migrations Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**/*.sql"
      - "supabase/release-migrations.txt"
      - "supabase/tests/**"
      - "supabase/functions/journal-delete-user/**"
      - "supabase/config.toml"
      - "scripts/deploy-supabase-release.py"
      - "tests/deploy-transport.test.py"
      - "tests/configure-db.test.py"
      - "scripts/configure-supabase-db.py"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Appliquer SQL et suppression securisee des comptes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: journal-ci-only
          POSTGRES_DB: journal_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d journal_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier les secrets requis
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Secret SUPABASE_ACCESS_TOKEN absent."; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "eqfwdcttvnnrakyaacjm" || { echo "Secret SUPABASE_PROJECT_ID absent ou projet inattendu."; exit 1; }

      - name: Installer Node pour les tests de la fonction
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tester les droits SQL sur une base jetable
        shell: bash
        run: |
          set -euo pipefail
          test_container="${{ job.services.postgres.id }}"
          docker exec -i "$test_container" psql -U postgres -d journal_release_test -v ON_ERROR_STOP=1 < supabase/tests/backend-fixture.sql
          docker exec -i "$test_container" psql -U postgres -d journal_release_test -v ON_ERROR_STOP=1 < supabase/migrations/20260906000200_v14_2_schema_production.sql
          docker exec -i "$test_container" psql -U postgres -d journal_release_test -v ON_ERROR_STOP=1 < supabase/tests/backend-assertions.sql

      - name: Tester la suppression de compte et ses refus d'acces
        run: node supabase/tests/edge-delete-user.test.cjs

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Tester le transport de migration sans reseau
        run: |
          python3 tests/deploy-transport.test.py
          python3 tests/configure-db.test.py

      - name: Installer le client PostgreSQL si configure
        if: env.SUPABASE_DB_URL != ''
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Verifier la connexion PostgreSQL en lecture seule
        if: env.SUPABASE_DB_URL != ''
        run: python3 scripts/deploy-supabase-release.py --check-connection

      - name: Appliquer uniquement les migrations de cette version
        run: python3 scripts/deploy-supabase-release.py

      - name: Deployer la suppression reservee a l'administrateur principal
        # The function validates the bearer token through auth.getUser itself.
        # Legacy gateway JWT validation does not accept all current Auth keys.
        run: supabase functions deploy journal-delete-user --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api

      - name: Verifier que la suppression anonyme est refusee
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            --output /tmp/journal-delete-user-check.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/journal-delete-user")"
          test "$status" = "401" || { echo "La fonction ne renvoie pas le refus attendu (HTTP $status)."; exit 1; }
