name: Installer les archives des rapports journaliers
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260907000700_archive_rapports_journaliers.sql'
      - 'supabase/tests/report-backend.cjs'
      - 'scripts/deploy-report-release.py'
      - 'tests/report-deploy.test.py'
      - '.github/workflows/deploy-report.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tester les droits, les deux applications et le déploiement
        run: |
          python3 tests/report-deploy.test.py
          npm install --prefix /tmp/report-tests @electric-sql/pglite@0.5.8 --no-audit --no-fund
          PGLITE_MODULE=/tmp/report-tests/node_modules/@electric-sql/pglite node supabase/tests/report-backend.cjs
          node tests/documents-report.test.cjs
          node tests/briefing-integration.test.cjs
          node --check app-v13.js
      - name: Installer le client PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Installer la nouvelle migration du rapport
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/deploy-report-release.py
